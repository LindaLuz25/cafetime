<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Formulario Producto - CafeTime</title>

    <!-- Google Fonts consistentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f5efe6;
            color: #3d2a1c;
        }

        /* NAVBAR PERSONALIZADO DE ADMINISTRACIÓN */
        .navbar-custom {
            background-color: #2b1704 !important; /* Un tono café aún más oscuro para distinguir la sección admin */
            border-bottom: 2px solid #6f4e37;
        }

        .navbar-custom .navbar-brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: #f5efe6 !important;
        }

        .btn-logout {
            background-color: transparent;
            color: #e6d5c3;
            border: 1px solid #6f4e37;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .btn-logout:hover {
            background-color: #6f4e37;
            color: #ffffff;
        }

        /* TITULO DE LA TARJETA */
        .card-header-coffee {
            background-color: #4a2c11 !important;
            color: #f5efe6;
            font-family: 'Playfair Display', serif;
            border-bottom: 1px solid #6f4e37;
        }

        .form-label {
            color: #5c4033;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-control:focus, .form-select:focus {
            border-color: #8c6239;
            box-shadow: 0 0 0 0.25rem rgba(140, 98, 57, 0.25);
        }

        /* DISEÑO DE LA CAJA DE PREVISUALIZACIÓN */
        .preview-box {
            border: 2px dashed #d7c4b7;
            background-color: #fcfbfa;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-placeholder {
            color: #a89485;
            text-align: center;
            font-size: 0.85rem;
        }

        /* BOTONES ACCIÓN */
        .btn-coffee {
            background-color: #6f4e37;
            color: #ffffff;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-coffee:hover {
            background-color: #4a2c11;
            color: #ffffff;
        }

        .btn-cancel {
            color: #6f4e37;
            background-color: transparent;
            border: 1px solid #6f4e37;
        }

        .btn-cancel:hover {
            background-color: #f5efe6;
            color: #4a2c11;
        }

        /* Switch personalizado */
        .form-check-input:checked {
            background-color: #6f4e37;
            border-color: #6f4e37;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm py-3">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/admin/dashboard}">
            ☕ CafeTime <span class="badge bg-secondary ms-2 fs-6 fw-normal" style="background-color: #6f4e37 !important;">Admin</span>
        </a>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button class="btn btn-logout px-3 rounded-pill">
                Cerrar sesión
            </button>
        </form>
    </div>
</nav>

<!-- CONTENEDOR PRINCIPAL -->
<div class="container mt-5 pb-5">
    <div class="row justify-content-center">
        <div class="col-xl-10"> <!-- Un poco más ancho para albergar cómodamente las dos columnas -->

            <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                <div class="card-header card-header-coffee p-4">
                    <h3 class="mb-0 fs-4 fw-bold"
                        th:text="${producto.id == null} ? 'Registrar Nueva Especialidad' : 'Editar Especialidad'">
                    </h3>
                </div>

                <div class="card-body p-4 p-md-5 bg-white">
                    <form th:action="@{/productos/guardar}"
                          th:object="${producto}"
                          method="post">

                        <input type="hidden" th:field="*{id}">

                        <div class="row g-4">

                            <!-- COLUMNA IZQUIERDA: CAMPOS DEL FORMULARIO -->
                            <div class="col-lg-7">

                                <div class="mb-3">
                                    <label class="form-label">Nombre del Producto</label>
                                    <input type="text" class="form-control py-2 rounded-3" th:field="*{nombre}" placeholder="Ej. Capuccino Vainilla">
                                    <div class="text-danger small mt-1" th:errors="*{nombre}"></div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Descripción Gourmet</label>
                                    <textarea class="form-control rounded-3" rows="3" th:field="*{descripcion}" placeholder="Detalla las notas de sabor, origen o ingredientes..."></textarea>
                                    <div class="text-danger small mt-1" th:errors="*{descripcion}"></div>
                                </div>

                                <div class="row mb-3">
                                    <div class="col-md-6 mb-3 mb-md-0">
                                        <label class="form-label">Precio ($)</label>
                                        <input type="number" step="0.01" class="form-control py-2 rounded-3" th:field="*{precio}" placeholder="0.00">
                                        <div class="text-danger small mt-1" th:errors="*{precio}"></div>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label">Stock Inicial</label>
                                        <input type="number" class="form-control py-2 rounded-3" th:field="*{stock}" placeholder="0">
                                        <div class="text-danger small mt-1" th:errors="*{stock}"></div>
                                    </div>
                                </div>

                                <div class="row mb-4">
                                    <div class="col-md-6 mb-3 mb-md-0">
                                        <label class="form-label">Categoría</label>
                                        <select class="form-select py-2 rounded-3" th:field="*{categoria}">
                                            <option value="">Seleccione...</option>
                                            <option value="Café">Café</option>
                                            <option value="Bebida">Bebida</option>
                                            <option value="Postre">Postre</option>
                                            <option value="Snack">Snack</option>
                                        </select>
                                        <div class="text-danger small mt-1" th:errors="*{categoria}"></div>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label">Imagen (URL web)</label>
                                        <input type="text" id="inputImagen" class="form-control py-2 rounded-3" th:field="*{imagen}" placeholder="https://images.unsplash.com/...">
                                    </div>
                                </div>

                                <div class="form-check form-switch mb-3">
                                    <input class="form-check-input" type="checkbox" th:field="*{activo}" id="statusSwitch">
                                    <label class="form-check-label text-secondary small" for="statusSwitch">Habilitar visualización en el catálogo público</label>
                                </div>

                            </div>

                            <!-- COLUMNA DERECHA: PREVISUALIZACIÓN EN TIEMPO REAL -->
                            <div class="col-lg-5 d-flex flex-column justify-content-start pt-2">
                                <label class="form-label mb-2">Vista Previa del Producto</label>
                                <div class="preview-box rounded-4 shadow-sm" id="boxPreview">
                                    <!-- Si al cargar ya existe una imagen (edición), se muestra inmediatamente -->
                                    <img id="imgPreview" th:src="*{imagen != null && imagen != ''} ? *{imagen} : ''"
                                         th:style="*{imagen != null && imagen != ''} ? 'display:block;' : 'display:none;'" alt="Preview">

                                    <div class="preview-placeholder" id="placeholderText"
                                         th:style="*{imagen != null && imagen != ''} ? 'display:none;' : 'display:block;'">
                                        <span class="fs-1 d-block mb-2">📸</span>
                                        La imagen se reflejará aquí<br>al pegar una URL válida.
                                    </div>
                                </div>
                            </div>

                        </div>

                        <!-- LÍNEA DE CONTROL Y BOTONES -->
                        <hr class="text-muted my-4">

                        <div class="d-flex justify-content-between align-items-center">
                            <a th:href="@{/productos}" class="btn btn-cancel px-4 py-2 rounded-3 small fw-medium">
                                Cancelar
                            </a>
                            <button type="submit" class="btn btn-coffee px-4 py-2 rounded-3 shadow-sm font-weight-500">
                                Guardar Especialidad
                            </button>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- LÓGICA DE PREVIEW EN JAVASCRIPT -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const inputImagen = document.getElementById("inputImagen");
        const imgPreview = document.getElementById("imgPreview");
        const placeholderText = document.getElementById("placeholderText");

        function actualizarPreview() {
            const url = inputImagen.value.trim();
            if (url) {
                imgPreview.src = url;
                imgPreview.style.display = "block";
                placeholderText.style.display = "none";
            } else {
                imgPreview.src = "";
                imgPreview.style.display = "none";
                placeholderText.style.display = "block";
            }
        }

        // Escucha cuando el usuario escribe o pega texto
        inputImagen.addEventListener("input", actualizarPreview);

        // Si la imagen falla al cargar (URL rota), vuelve al estado placeholder
        imgPreview.addEventListener("error", function() {
            imgPreview.style.display = "none";
            placeholderText.style.display = "block";
        });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
