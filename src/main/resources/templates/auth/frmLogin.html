<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Login CafeTime</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            /* Fondo con un degradado cálido que simula café con leche o ambiente tenue */
            background: linear-gradient(135deg, #f5efe6 0%, #e6d5c3 100%);
            background-attachment: fixed;
        }

        .brand-title {
            font-family: 'Playfair Display', serif;
            color: #4a2c11; /* Marrón grano de café */
            font-size: 2.2rem;
        }

        .card-login {
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            border: 1px solid #d7c4b7;
        }

        .form-label {
            color: #5c4033;
            font-weight: 500;
        }

        /* Personalización de los inputs al hacer foco */
        .form-control:focus {
            border-color: #8c6239;
            box-shadow: 0 0 0 0.25rem rgba(140, 98, 57, 0.25);
        }

        /* Botón estilo café premium */
        .btn-coffee {
            background-color: #6f4e37; /* Café clásico */
            color: #ffffff;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-coffee:hover {
            background-color: #4a2c11;
            color: #ffffff;
            transform: translateY(-1px);
        }

        .coffee-link {
            color: #8c6239;
            text-decoration: none;
            font-weight: 500;
        }

        .coffee-link:hover {
            color: #4a2c11;
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="row justify-content-center align-items-center vh-100">
        <div class="col-md-5 col-lg-4"> <div class="card shadow-lg border-0 rounded-4 card-login">
            <div class="card-body p-4 p-md-5">

                <div class="text-center mb-4">
                    <span class="fs-1">☕</span>
                    <h3 class="brand-title mt-2 mb-1">CafeTime</h3>
                    <p class="text-muted small">Tu momento, tu espacio</p>
                </div>

                <div class="alert alert-danger border-0 small"
                     th:if="${param.error}">
                    Usuario o contraseña incorrectos.
                </div>

                <div class="alert alert-success border-0 small"
                     th:if="${param.logout}">
                    Sesión cerrada correctamente.
                </div>

                <form th:action="@{/auth/login}"
                      method="post"
                      th:object="${form}">
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>

                    <div class="mb-3">
                        <label class="form-label">Usuario</label>
                        <input
                                type="text"
                                class="form-control py-2 rounded-3"
                                th:field="*{username}"
                                placeholder="ejemplo@cafe.com">
                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('username')}"
                             th:errors="*{username}">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Contraseña</label>
                        <input
                                type="password"
                                class="form-control py-2 rounded-3"
                                th:field="*{password}"
                                placeholder="••••••••">
                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('password')}"
                             th:errors="*{password}">
                        </div>
                    </div>

                    <div class="d-grid">
                        <button
                                type="submit"
                                class="btn btn-coffee btn-lg rounded-3 fs-6 py-2 shadow-sm">
                            Iniciar Sesión
                        </button>
                    </div>

                    <div class="text-center mt-4 small text-secondary">
                        ¿Aún no eres parte?
                        <a th:href="@{/auth/registrar}" class="coffee-link ms-1">
                            Crear cuenta
                        </a>
                    </div>
                </form>
            </div>
        </div>

            <div class="text-center mt-4 text-muted custom-footer" style="font-size: 0.75rem; letter-spacing: 1px;">
                CAFETIME
            </div>
        </div>
    </div>
</div>
</body>
</html>
