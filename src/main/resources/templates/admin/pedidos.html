<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Pedidos | CafeTime</title>

    <!-- Google Fonts consistentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f5efe6;
            color: #3d2a1c;
        }

        /* NAVBAR PREMIUM DE ADMINISTRACIÓN */
        .navbar-custom {
            background-color: #2b1704 !important;
            border-bottom: 2px solid #6f4e37;
        }

        .navbar-custom .navbar-brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: #f5efe6 !important;
        }

        /* BOTONES DEL NAVBAR */
        .btn-dashboard {
            color: #e6d5c3;
            border: 1px solid #6f4e37;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .btn-dashboard:hover {
            background-color: #6f4e37;
            color: #ffffff;
            border-color: #6f4e37;
        }

        .btn-logout-custom {
            background-color: transparent;
            color: #ff8a8a;
            border: 1px solid rgba(255, 138, 138, 0.3);
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .btn-logout-custom:hover {
            background-color: #dc3545;
            color: #ffffff;
            border-color: #dc3545;
        }

        /* DISEÑO DE LA TARJETA PRINCIPAL */
        .card-orders {
            background-color: #ffffff;
            border: 1px solid #e6d5c3 !important;
        }

        .card-orders .card-header {
            background-color: #4a2c11 !important;
            color: #f5efe6;
            font-family: 'Playfair Display', serif;
            border-bottom: 1px solid #6f4e37;
        }

        /* ESTILOS DE LA TABLA DE PEDIDOS */
        .table-custom thead {
            background-color: #fcfbfa;
            border-bottom: 2px solid #e6d5c3;
        }

        .table-custom th {
            color: #8c6239;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            padding: 15px 10px;
        }

        .table-custom td {
            font-size: 0.9rem;
            padding: 16px 10px;
            border-bottom: 1px solid #f1eae1;
        }

        .order-id {
            font-weight: 600;
            color: #8c6239;
        }

        .client-name {
            font-weight: 500;
            color: #3d2a1c;
        }

        .product-item {
            background-color: #fdfbf7;
            border: 1px solid #f1eae1;
            color: #5c4033;
            font-size: 0.8rem;
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
            margin: 2px 0;
        }

        .order-total {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            color: #4a2c11;
            font-size: 1rem;
        }

        /* PERSONALIZACIÓN DE BADGES DE ESTADO */
        .badge-status {
            padding: 6px 12px;
            font-weight: 500;
            font-size: 0.75rem;
            border-radius: 20px;
        }

        .bg-pending { background-color: #fff3cd !important; color: #856404 !important; }
        .bg-preparing { background-color: #cff4fc !important; color: #055160 !important; }
        .bg-delivered { background-color: #d1e7dd !important; color: #0f5132 !important; }
        .bg-cancelled { background-color: #f8d7da !important; color: #842029 !important; }

        /* FORMULARIO DE ACCIÓN DENTRO DE LA TABLA */
        .select-status {
            font-size: 0.8rem;
            border-color: #d7c4b7;
            color: #5c4033;
        }

        .select-status:focus {
            border-color: #8c6239;
            box-shadow: 0 0 0 0.2rem rgba(140, 98, 57, 0.15);
        }

        .btn-update-status {
            background-color: #6f4e37;
            color: #ffffff;
            border: none;
            font-size: 0.75rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-update-status:hover {
            background-color: #4a2c11;
            color: #ffffff;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm py-3">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/admin/dashboard}">
            ☕ CafeTime <span class="badge bg-secondary ms-2 fs-6 fw-normal" style="background-color: #6f4e37 !important;">Admin</span>
        </a>

        <div class="ms-auto d-flex gap-2">
            <a class="btn btn-dashboard px-3 rounded-pill" th:href="@{/admin/dashboard}">
                <i class="bi bi-speedometer2 me-1"></i> Dashboard
            </a>
            <form th:action="@{/logout}" method="post" class="m-0 d-inline">
                <button class="btn btn-logout-custom px-3 rounded-pill">
                    <i class="bi bi-box-arrow-right me-1"></i> Salir
                </button>
            </form>
        </div>
    </div>
</nav>

<!-- CONTENEDOR PRINCIPAL -->
<div class="container py-5">

    <div class="card shadow-sm border-0 rounded-4 overflow-hidden card-orders">
        <div class="card-header p-4">
            <h3 class="mb-0 fs-4 fw-bold">
                <i class="bi bi-bag-check-fill me-2"></i>
                Gestión y Despacho de Pedidos
            </h3>
        </div>

        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle table-custom mb-0">
                    <thead>
                    <tr>
                        <th style="width: 8%"># ID</th>
                        <th style="width: 18%">Cliente</th>
                        <th style="width: 25%">Productos Solicitados</th>
                        <th style="width: 15%">Fecha / Hora</th>
                        <th style="width: 12%">Total</th>
                        <th style="width: 10%">Estado</th>
                        <th style="width: 12%" class="text-center">Acción</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="pedido : ${pedidos}">
                        <!-- ID del pedido -->
                        <td class="order-id" th:text="'#' + ${pedido.id}"></td>

                        <!-- Nombre de cliente -->
                        <td class="client-name" th:text="${pedido.usuario.nombre}"></td>

                        <!-- Lista de productos comprados -->
                        <td>
                            <div class="d-flex flex-column align-items-start">
                                <div th:each="detalle : ${pedido.detalles}" class="product-item">
                                    <i class="bi bi-cup-hot-fill me-1" style="font-size: 0.7rem; color: #8c6239;"></i>
                                    <span th:text="${detalle.producto.nombre}"></span>
                                </div>
                            </div>
                        </td>

                        <!-- Fecha con formato limpio -->
                        <td class="text-secondary small" th:text="${#temporals.format(pedido.fecha,'dd/MM/yyyy HH:mm')}"></td>

                        <!-- Total del pedido con moneda de Perú (S/.) -->
                        <td class="order-total">
                            S/. <span th:text="${pedido.total}">0.00</span>
                        </td>

                        <!-- Estado actual con Badges estilizadas -->
                        <td>
                            <span th:if="${pedido.estado=='PENDIENTE'}" class="badge badge-status bg-pending">Pendiente</span>
                            <span th:if="${pedido.estado=='PREPARANDO'}" class="badge badge-status bg-preparing">Preparando</span>
                            <span th:if="${pedido.estado=='ENTREGADO'}" class="badge badge-status bg-delivered">Entregado</span>
                            <span th:if="${pedido.estado=='CANCELADO'}" class="badge badge-status bg-cancelled">Cancelado</span>
                        </td>

                        <!-- Cambiar Estado -->
                        <td>
                            <form th:action="@{/pedido/{id}/estado(id=${pedido.id})}" method="post" class="p-1">
                                <select name="estado" class="form-select form-select-sm select-status mb-2 rounded-3">
                                    <option value="PENDIENTE" th:selected="${pedido.estado=='PENDIENTE'}">Pendiente</option>
                                    <option value="PREPARANDO" th:selected="${pedido.estado=='PREPARANDO'}">Preparando</option>
                                    <option value="ENTREGADO" th:selected="${pedido.estado=='ENTREGADO'}">Entregado</option>
                                    <option value="CANCELADO" th:selected="${pedido.estado=='CANCELADO'}">Cancelado</option>
                                </select>
                                <button class="btn btn-update-status btn-sm w-100 rounded-3 shadow-sm py-1">
                                    <i class="bi bi-arrow-repeat me-1"></i> Aplicar
                                </button>
                            </form>
                        </td>
                    </tr>

                    <!-- Lista vacía de pedidos -->
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td colspan="7" class="text-center text-muted py-5 bg-white">
                            <span class="fs-2 d-block mb-2">📋</span>
                            No existen órdenes de compra registradas en el sistema.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
