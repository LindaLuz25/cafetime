<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Registro CafeTime</title>

    <!-- Google Fonts coincidentes con el Login -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5efe6 0%, #e6d5c3 100%);
            background-attachment: fixed;
        }

        .brand-title {
            font-family: 'Playfair Display', serif;
            color: #4a2c11;
            font-size: 2rem;
        }

        .card-register {
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            border: 1px solid #d7c4b7;
        }

        .form-label {
            color: #5c4033;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-control:focus {
            border-color: #8c6239;
            box-shadow: 0 0 0 0.25rem rgba(140, 98, 57, 0.25);
        }

        /* Botón Principal - Café Premium */
        .btn-coffee {
            background-color: #6f4e37;
            color: #ffffff;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-coffee:hover {
            background-color: #4a2c11;
            color: #ffffff;
            transform: translateY(-1px);
        }

        /* Botón Secundario - Contorno Estilizado */
        .btn-outline-coffee {
            color: #6f4e37;
            border-color: #6f4e37;
            transition: all 0.3s ease;
        }

        .btn-outline-coffee:hover {
            background-color: #f5efe6;
            color: #4a2c11;
            border-color: #4a2c11;
        }

        /* Centrar visualmente el contenedor de reCAPTCHA */
        .captcha-container {
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100 py-5">
        <div class="col-md-7 col-lg-6"> <!-- Espacio ideal para un formulario de dos columnas -->

            <div class="card shadow-lg border-0 rounded-4 card-register">
                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">
                        <span class="fs-2">☕</span>
                        <h3 class="brand-title mt-1 mb-1">Registro de Cliente</h3>
                        <p class="text-muted small">Únete a nuestra comunidad sibarita</p>
                    </div>

                    <form th:action="@{/auth/guardarUsuario}"
                          method="post"
                          th:object="${usuario}">

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nombre</label>
                                <input
                                        type="text"
                                        class="form-control py-2 rounded-3"
                                        th:field="*{nombre}"
                                        placeholder="Tu nombre">
                                <div class="text-danger small mt-1"
                                     th:if="${#fields.hasErrors('nombre')}"
                                     th:errors="*{nombre}">
                                </div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Apellido</label>
                                <input
                                        type="text"
                                        class="form-control py-2 rounded-3"
                                        th:field="*{apellido}"
                                        placeholder="Tu apellido">
                                <div class="text-danger small mt-1"
                                     th:if="${#fields.hasErrors('apellido')}"
                                     th:errors="*{apellido}">
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Usuario</label>
                            <input
                                    type="text"
                                    class="form-control py-2 rounded-3"
                                    th:field="*{username}"
                                    placeholder="Elige un alias">
                            <div class="text-danger small mt-1"
                                 th:if="${#fields.hasErrors('username')}"
                                 th:errors="*{username}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Correo electrónico</label>
                            <input
                                    type="email"
                                    class="form-control py-2 rounded-3"
                                    th:field="*{email}"
                                    placeholder="ejemplo@cafe.com">
                            <div class="text-danger small mt-1"
                                 th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Contraseña</label>
                            <input
                                    type="password"
                                    class="form-control py-2 rounded-3"
                                    th:field="*{password}"
                                    placeholder="Crea una clave segura">
                            <div class="text-danger small mt-1"
                                 th:if="${#fields.hasErrors('password')}"
                                 th:errors="*{password}">
                            </div>
                        </div>

                        <!-- reCAPTCHA Estilizado -->
                        <div class="mb-4 captcha-container">
                            <div class="g-recaptcha"
                                 th:attr="data-sitekey=${recaptchaSiteKey}">
                            </div>
                        </div>

                        <!-- Error del captcha -->
                        <div class="alert alert-danger border-0 small mb-4"
                             th:if="${errorCaptcha}"
                             th:text="${errorCaptcha}">
                        </div>

                        <!-- Botones de Acción -->
                        <div class="d-grid gap-2 mt-2">
                            <button
                                    type="submit"
                                    class="btn btn-coffee btn-lg rounded-3 fs-6 py-2 shadow-sm">
                                Registrarme
                            </button>
                            <a
                                    th:href="@{/auth/login}"
                                    class="btn btn-outline-coffee rounded-3 fs-6 py-2">
                                Volver al Login
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="text-center mt-4 text-muted" style="font-size: 0.75rem; letter-spacing: 1px;">
                CAFETIME &bull; SPRING SECURITY
            </div>
        </div>
    </div>
</div>
</body>
</html>
